<div class="app-content-header">
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-6">
        <h1 class="mb-0 fs-3">Nueva noticia</h1>
      </div>
      <div class="col-sm-6">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb float-sm-end">
            <li class="breadcrumb-item"><a href="/panel" hx-get="./fragmentos/panel.html"
                hx-target="#app-container" hx-swap="innerHTML" data-ruta="/panel">Panel</a></li>
            <li class="breadcrumb-item">Gestión WEB</li>
            <li class="breadcrumb-item"><a href="/web/noticias" hx-get="./fragmentos/web/noticias.html"
                hx-target="#app-container" hx-swap="innerHTML" data-ruta="/web/noticias">Noticias</a></li>
            <li class="breadcrumb-item active" aria-current="page">Nueva</li>
          </ol>
        </nav>
      </div>
    </div>
  </div>
</div>

<div class="app-content">
  <div class="container-fluid">
    <form id="form-noticia">
      <div class="row">
        <div class="col-lg-8">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Contenido</h3>
            </div>
            <div class="card-body">
              <div class="mb-3">
                <label for="titulo-noticia" class="form-label">Título *</label>
                <input type="text" class="form-control" id="titulo-noticia" required
                  placeholder="Ej: Campeonato Argentino 2026">
              </div>

              <div class="mb-3">
                <label for="resumen-noticia" class="form-label">Resumen</label>
                <textarea class="form-control" id="resumen-noticia" rows="2"
                  placeholder="Breve descripción que aparecerá en el listado"></textarea>
              </div>

              <div class="mb-3">
                <label for="contenido-noticia" class="form-label">Cuerpo de la noticia</label>
                <textarea class="form-control" id="contenido-noticia" name="contenido" rows="15"></textarea>
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Publicación</h3>
            </div>
            <div class="card-body">
              <div class="mb-3">
                <label for="estado-noticia" class="form-label">Estado</label>
                <select class="form-select" id="estado-noticia">
                  <option value="borrador">Borrador</option>
                  <option value="publicada">Publicada</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="fecha-noticia" class="form-label">Fecha</label>
                <input type="date" class="form-control" id="fecha-noticia">
              </div>

              <div class="mb-3">
                <label for="autor-noticia" class="form-label">Autor</label>
                <input type="text" class="form-control" id="autor-noticia" value="Administrador">
              </div>

              <div class="mb-3">
                <label for="categoria-noticia" class="form-label">Categoría</label>
                <select class="form-select" id="categoria-noticia">
                  <option value="">Sin categoría</option>
                  <option>Eventos</option>
                  <option>Competiciones</option>
                  <option>Institucional</option>
                  <option>Prensa</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="imagen-portada" class="form-label">Imagen de portada</label>
                <input type="file" class="d-none" id="imagen-portada" accept="image/*">
                <div class="input-group">
                  <button type="button" class="btn btn-outline-secondary" id="btn-elegir-portada">
                    <i class="bi bi-folder2-open me-1"></i> Elegir archivo
                  </button>
                  <input type="text" class="form-control" id="nombre-archivo-portada"
                    placeholder="Ningún archivo seleccionado" readonly>
                </div>
                <div class="form-text">Se muestra en el listado. Máx. 2 MB.</div>
                <div id="preview-portada" class="mt-2"></div>
              </div>
            </div>
            <div class="card-footer d-flex gap-2">
              <button type="submit" class="btn btn-primary flex-grow-1">
                <i class="bi bi-save me-1"></i> Guardar
              </button>
              <a href="/web/noticias" hx-get="./fragmentos/web/noticias.html" hx-target="#app-container"
                hx-swap="innerHTML" data-ruta="/web/noticias" class="btn btn-outline-secondary">
                Cancelar
              </a>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
